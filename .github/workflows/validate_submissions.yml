name: Validate Leaderboard Submissions

on:
  push:
    paths:
      - 'leaderboard/**'
  pull_request:
    paths:
      - 'leaderboard/**'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  validate-submissions:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run submission format validation tests
      run: |
        python -m pytest tests/test_submission_format.py -v --tb=long --no-header

    - name: Write validation summary
      if: always()
      run: |
        SUBMISSION_COUNT=$(find leaderboard -maxdepth 1 -mindepth 1 -type d | wc -l)
        TEST_OUTPUT=$(python -m pytest tests/test_submission_format.py -v --tb=long --no-header 2>&1 || true)

        if echo "$TEST_OUTPUT" | grep -q "FAILED"; then
          STATUS="❌ Some validation tests failed."
        else
          STATUS="✅ All validation tests passed!"
        fi

        {
          echo "## Submission Validation Results"
          echo ""
          echo "**Submissions found:** $SUBMISSION_COUNT"
          echo ""
          echo "**Directories:**"
          for dir in leaderboard/*/; do
            echo "- \`$(basename "$dir")\`"
          done
          echo ""
          echo "**Test Output:**"
          echo '```'
          echo "$TEST_OUTPUT"
          echo '```'
          echo ""
          echo "$STATUS"
        } >> "$GITHUB_STEP_SUMMARY"
