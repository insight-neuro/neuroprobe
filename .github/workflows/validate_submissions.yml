name: Validate Leaderboard Submissions

on:
  push:
    paths:
      - 'leaderboard/**'
      - 'tests/test_submission_format.py'
      - '.github/workflows/validate_submissions.yml'
  pull_request:
    paths:
      - 'leaderboard/**'
      - 'tests/test_submission_format.py'
      - '.github/workflows/validate_submissions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-submissions:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install 'pytest>=9,<10'

      - name: Run submission format validation tests
        id: validation
        shell: bash
        run: |
          python -m pytest tests/test_submission_format.py -v --tb=long --no-header \
            |& tee "$RUNNER_TEMP/submission-validation.log"

      - name: Write validation summary
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          {
            echo "## Submission Validation Results"
            echo ""
            case "$VALIDATION_OUTCOME" in
              success) echo "✅ Submission format validation passed." ;;
              failure) echo "❌ Submission format validation failed." ;;
              *) echo "⚠️ Submission format validation did not run. See the job steps for details." ;;
            esac

            if [[ -f "$RUNNER_TEMP/submission-validation.log" ]]; then
              echo ""
              echo '~~~~text'
              cat "$RUNNER_TEMP/submission-validation.log"
              echo '~~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
